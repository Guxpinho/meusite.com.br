<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formatação de links</title>
</head>
<style>
    a:link{
        color: rgb(255, 167, 176); /* Cor do link não visitado */
        text-decoration: none; /* Remove o sublinhado */
    }
    a:visited {
        color: rgb(217, 10, 228); /* Cor do link visitado */
    }
    a:hover {
        color: red; /* Cor do link ao passar o mouse */
    }
    a:active {
        color: rgb(255, 247, 0); /* Cor do link ativo (clicado) */
    }
    
</style>
<body>
    <h1>
    <a href="links.html">Ir para Links</a>
    </h1>

</body>
</html>
