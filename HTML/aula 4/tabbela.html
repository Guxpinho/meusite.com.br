<!DOCTYPE html>
<html lang="en">
<head>

    <title>Tabelas</title>
</head>
<body style="text-align: center;">

        <thead>

                <th>Nome</th>
                <th>Idade</th>
           
            </tr>

                <td>Gustavo</td>

            </tr>
            <tr>
                <td>Henrique</td>
                <td>16</td>
     
            </tr>
            <tr>
                <td>Clara</td>
                <td>18</td>
          
            </tr>
            <tr>
                <td colspan="3">Total de Pessoas: 3</td>
            </tr>

    </table>
</body>
</html>
