<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    h2 {
        text-align: center;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    }
    form {
        margin: 0 auto;
        width: 50%;
        padding: 20px;
        border: 3px solid #050505;
        border-radius: 5px;
        background-color: #a7a7a7;
    }
    textarea {
        width: 95%;
        padding: 10px;
        border: 1px solid #050505;
        border-radius: 5px;
        resize: vertical;
    }
    p {
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        font-size: 15px;
    }
</style>
<body>
<h2>Formulário</h2>
            <form action="cadastro.php" method="post">
                <p><label>Nome:</label>
                    <input type="text" name="nome" placeholder="Digite seu nome" required>
                </p>
                <p><label>Senha:</label>
                    <input type="password" name="senha" placeholder="Digite sua senha" required maxlength="8">
                </p>
                <p><label>Sobre você:</label>
                    <textarea name="bio" rows="10" cols="100" placeholder="Conte-nos sobre você"></textarea>
                </p>
                 <p><label>E-mail:</label>
                    <input type="email" name="email" placeholder="Seu E-mail" required>
                </p>
                <p><label>Telefone:</label>
                    <input type="text" name="telefone" pattern=" [0-9]{5}-[0-9]{4}" placeholder="(99) 99999-9999" required title="Use o formato: (99) 99999-9999" required maxlength="11">
                </p>
                <p><label>CEP:</label>
                    <input type="text" name="cep" pattern="[0-9]{5}-[0-9]{3}" placeholder="00000-000" required title="Use o formato: 00000-000">
                </p>   
                <p><label>Gênero:</label>
                    <input type="radio" name="genero" value="M">Masculino
                    <input type="radio" name="genero" value="F">Feminino<br>
                    <input type="radio" name="genero" value="O">não binário
                    <input type="radio" name="genero" value="N">Prefiro não dizer
                </p>
                <p><label>Interesses:</label>
                    <input type="checkbox" name="interesses" value="tecnologia">Tecnologia
                    <input type="checkbox" name="interesses" value="esporte">Esporte
                    <input type="checkbox" name="interesses" value="arte">Arte
                </p>
                <p><label>País:</label>
                    <select name="pais">
                        <option value="">---</option>
                        <option value="brasil">Brasil</option>
                        <option value="argentina">Argentina</option>
                        <option value="chile">Chile</option>
                    </select>
                </p>
                <p><label>Foto de perfil:</label>
                    <input type="file" name="foto" accept="image/*">
                </p>
                <input type="submit" value="Enviar" style="background-color: #4CAF50; color: white;">
                <input type="reset" value="Limpar" style="background-color: #f44336; color: white;">
            </form>
</body>
</html>
