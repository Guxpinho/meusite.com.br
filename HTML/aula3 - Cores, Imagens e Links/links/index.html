<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <h1>Listas</h1>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
    <ol>
        <li>Item A</li>
        <li>Item B</li>
        <li>Item C</li>
    </ol>
    <dl>
        <dt>Termo 1</dt>
        <dd>Descrição 1</dd>
        <dt>Termo 2</dt>
        <dd>Descrição 2</dd>
        <dt>Termo 3</dt>
        <dd>Descrição 3</dd>
    </dl>
</body>
</html>
